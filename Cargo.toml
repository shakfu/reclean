[package]
name = "reclean"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
authors = ["Shakeeb Alireza"]
description = "Safely remove files and directories matching a set of glob patterns."
readme = "README.md"
homepage = "https://github.com/shakfu/reclean"
repository = "https://github.com/shakfu/reclean"
license = "MIT"
keywords = ["clean", "delete", "cleanup", "filesystem", "glob"]
categories = ["command-line-utilities"]
include = ["/src", "/tests", "Cargo.toml", "LICENSE", "README.md", "CHANGELOG.md"]

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
dialoguer = "0.12"
dirs = "6"
globset = "0.4.16"
indicatif = "0.18"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"

[profile.release]
strip = true        # Automatically strip symbols from the binary.
opt-level = "z"     # Optimize for size.
lto = true          # Enable link time optimization
# panic = "abort"